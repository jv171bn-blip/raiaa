  <script>
    (function () {
      try {
        var isMobile = /Mobi|Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth > 0 && window.innerWidth <= 768);
        var path = window.location.pathname.toLowerCase().replace(/\/+$/, '');
        var hash = window.location.hash.toLowerCase();
        var search = window.location.search.toLowerCase();

        // Se for usuário mobile entrando no domínio diretamente na página raiz (Quem Somos), redireciona para /inicio.
        // Mas se tiver clicado na sessão quem somos (hash #quem-somos ou flag na sessão), NÃO redireciona!
        if (isMobile && (path === '' || path === '/') && (!hash || hash === '#') && (!search || (!search.includes('produto=') && !search.includes('id=')))) {
          var userClicked = sessionStorage.getItem('clicked_quem_somos') === 'true';
          if (!userClicked) {
            window.location.replace('/inicio');
          }
        }
      } catch (e) {}
    })();
